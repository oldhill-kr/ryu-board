<title>board</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#16171a;color:#d9d9de;
font:16px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:16px}
form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;background:#1f2024;border:1px solid #2c2d33;
border-radius:12px;padding:24px}
h1{margin:0 0 4px;font-size:18px;font-weight:600;color:#f0f0f3}
input[type=password]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3a3b42;background:#121316;
color:#f0f0f3;font-size:16px}
input[type=password]:focus{outline:2px solid #5b6cff;outline-offset:1px}
label{display:flex;align-items:center;gap:8px;font-size:14px;color:#a9a9b2}
button{padding:10px;border:0;border-radius:8px;background:#3d4250;color:#fff;font-size:16px;cursor:pointer}
button:hover{background:#4a5061}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.5em;margin:0;font-size:14px;color:#ff8a80}
#msg.info{color:#a9a9b2}
</style>

var K="ryu-board-key";
var f=document.getElementById("f"),pw=document.getElementById("pw"),rm=document.getElementById("rm"),
go=document.getElementById("go"),msg=document.getElementById("msg");
function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function u2b(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function sget(){try{return localStorage.getItem(K);}catch(e){return null;}}
function sset(v){try{localStorage.setItem(K,v);}catch(e){}}
function sdel(){try{localStorage.removeItem(K);}catch(e){}}
function show(t,info){f.hidden=false;go.disabled=false;msg.textContent=t||"";msg.className=info?"info":"";pw.focus();}
function reveal(key,keep){
  var raw=b2u(P.d);
  return crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12)).then(function(pt){
    if(!keep){return pt;}
    return crypto.subtle.exportKey("raw",key).then(function(r){sset(u2b(new Uint8Array(r)));return pt;});
  }).then(function(pt){
    var html=new TextDecoder().decode(pt);
    function draw(){document.open();document.write(html);document.close();}
    // 저장된 열쇠로 바로 풀면 아직 이 페이지를 읽는 중일 수 있다. 그때 쓰면 입력창이 지워지지 않고 남는다.
    if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",draw);}else{draw();}
  });
}
if(!(window.crypto&&crypto.subtle)){show("이 브라우저에서는 열 수 없습니다");go.disabled=true;return;}
var locked=/(^|[?&])lock(=|&|$)/.test(location.search.slice(1));
if(locked){sdel();}
f.addEventListener("submit",function(ev){
  ev.preventDefault();
  var keep=rm.checked;
  go.disabled=true;msg.className="info";msg.textContent="여는 중…";
  crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(P.s),iterations:P.i,hash:"SHA-256"},base,
      {name:"AES-GCM",length:256},keep,["decrypt"]);
  }).then(function(key){return reveal(key,keep);}).catch(function(){pw.value="";show("비밀번호가 맞지 않습니다");});
});
var saved=locked?null:sget();
if(saved){
  crypto.subtle.importKey("raw",b2u(saved),{name:"AES-GCM"},false,["decrypt"]).then(function(k){return reveal(k,false);}).catch(function(){
    sdel();show("저장된 열쇠가 맞지 않아 지웠습니다. 비밀번호를 입력하세요.",true);
  });
}else{
  show(locked?"이 기기의 저장된 열쇠를 지웠습니다.":"",true);
}
})();
